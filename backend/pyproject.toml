[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "astro-parallax-backend"
version = "0.1.0"
description = "Local image-processing API for Astro Parallax Studio"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.12,<1",
  "numpy>=2,<3",
  "Pillow>=11,<13",
  "tifffile>=2025.1",
  "opencv-python-headless>=4.10,<6",
  "scikit-image>=0.25,<1"
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
