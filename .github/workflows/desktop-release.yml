name: Desktop release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install -e 'backend[dev]'
          cd frontend && npm ci
      - name: Test
        run: |
          backend/.venv/bin/pytest -q backend/tests
          cd frontend && npm test -- --watch=false --no-progress
          npm run desktop:test-worker
      - name: Create signing key file
        if: ${{ secrets.APPLE_API_KEY_BASE64 != '' }}
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
      - name: Package
        working-directory: frontend
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_BASE64 != '' && format('{0}/AuthKey.p8', runner.temp) || '' }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: npm run desktop:dist
      - name: Verify package
        working-directory: frontend
        run: npm run desktop:verify
      - name: Checksums
        working-directory: frontend/release
        run: shasum -a 256 Paralastro-* > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: paralastro-macos-arm64
          path: |
            frontend/release/Paralastro-*.dmg
            frontend/release/Paralastro-*.zip
            frontend/release/SHA256SUMS.txt
